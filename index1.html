<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style1.css" rel="stylesheet">
</head>
<body>
 <div>   <h4 class="text-center">Student Registration</h4>
<p class="text-center">Please fill in the form below </p></div>
<div class="container"><form>
    <div class="mb-3">
    <label>Full Name</label>
    <input type="text" class="form-control" placeholder=" Enter your name"></div>
    <div class="mb-3"><label>Email</label>
    <input type="email" class="form-control" placeholder="Enter your email"></div>
    <div class="mb-3"><label>Password</label>
    <input type="password" class="form-control" placeholder="Enter password"></div>
    <div class="mb-3"><label>Date of Birth</label>
    <input type="date" class="form-control"></div>
    <div class="mb-3"><label>Department</label><br>
    <select class="form-control" >
        <option>CSE</option>
        <option>EEE</option>
        <option>BBA</option>
        <option>LAW</option>
        <option>ENglish</option>
    </select></div>
   <div class="mb-3"> <label>Gender</label><br>
    <input type="radio" name="gender" >Male
    <input type="radio" name="gender" >Female
    <input type="radio" name="gender" >Other
    </div>
    <div class="mb-3"><label>Hobbies</label><br>
    <input type="checkbox" >Reading
    <input type="checkbox" >Gaming
    <input type="checkbox" >Sports
    <input type="checkbox" >Music
    </div>
    <div class="mb-3"><label>Address</label>
    <textarea placeholder="Enter your address" class="form-control"></textarea></div>
   <div class="text-center"> 
     <button class="btn my-button">Register</button>
   <button class="btn my-button">Reset</button> </div>

</form></div>

    

</body>
</html>
